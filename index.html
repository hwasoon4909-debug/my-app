<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B7480">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="물 한잔">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>물 한잔</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <h1>물 한잔</h1>
  </header>

  <main class="content">
    <!-- 오늘의 기록 -->
    <section class="card today" aria-label="오늘의 기록">
      <p class="today-date" id="todayDate"></p>
      <p class="today-count"><span id="todayCups">0</span><span class="unit">잔</span></p>
      <p class="today-ml" id="todayMl">0 mL</p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="8" id="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="today-msg" id="todayMsg"></p>
      <p class="today-last" id="todayLast"></p>
      <button type="button" class="btn-sub" id="removeBtn">잘못 눌렀어요 (한 잔 빼기)</button>
    </section>

    <!-- 주 / 월 기록 -->
    <section class="card stats" aria-label="주, 월 기록">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tabWeek" aria-selected="true">주</button>
        <button type="button" role="tab" class="tab" id="tabMonth" aria-selected="false">월</button>
      </div>
      <div class="period">
        <button type="button" class="btn-arrow" id="prevBtn" aria-label="이전">‹</button>
        <p class="period-title" id="periodTitle"></p>
        <button type="button" class="btn-arrow" id="nextBtn" aria-label="다음">›</button>
      </div>
      <div id="chart"></div>
      <dl class="summary" id="summary"></dl>
    </section>
  </main>

  <footer class="bottom">
    <button type="button" class="btn-main" id="addBtn">+ 한 잔 마셨어요</button>
  </footer>

  <!-- 지우기 전에 묻는 창 -->
  <dialog id="confirmDialog" class="dialog">
    <p class="dialog-title">정말 지울까요?</p>
    <p class="dialog-text">오늘 기록에서 한 잔을 뺄게요.</p>
    <div class="dialog-buttons">
      <button type="button" class="btn-cancel" id="cancelBtn">취소</button>
      <button type="button" class="btn-danger" id="okBtn">지우기</button>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
