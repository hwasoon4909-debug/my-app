<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769C2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="물 한잔">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>물 한잔</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- 글씨체: Pretendard (인터넷이 안 되면 휴대폰 기본 글씨체로 보여요) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="hello">오늘도 촉촉하게</p>
      <h1>물 한잔</h1>
    </div>
    <div class="top-right">
      <button type="button" class="btn-sound" id="soundBtn" aria-pressed="true" aria-label="물소리 켜짐">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="btn-sound" id="settingsBtn" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-gear"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <!-- 오늘의 기록 -->
    <section class="card today" aria-label="오늘의 기록">
      <p class="card-label">오늘 마신 물 <span class="card-date" id="todayDate"></span></p>
      <div class="today-main">
        <!-- 출렁이는 물통 -->
        <div class="bottle" id="progress" role="progressbar" aria-label="오늘 목표까지" aria-valuemin="0" aria-valuemax="8">
          <div class="bottle-cap"></div>
          <div class="bottle-neck"></div>
          <div class="bottle-body" id="bottleBody">
            <div class="water" id="water">
              <svg class="wave wave-back" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q12.5 2 25 10 T50 10 T75 10 T100 10 T125 10 T150 10 T175 10 T200 10 V20 H0 Z"/></svg>
              <svg class="wave wave-front" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q12.5 2 25 10 T50 10 T75 10 T100 10 T125 10 T150 10 T175 10 T200 10 V20 H0 Z"/></svg>
            </div>
            <div class="bottle-marks" aria-hidden="true"></div>
          </div>
        </div>
        <div class="today-numbers">
          <p class="today-count"><span id="todayCups">0</span><span class="unit">잔</span></p>
          <p class="today-ml" id="todayMl">0 mL</p>
          <p class="today-msg" id="todayMsg"></p>
        </div>
      </div>
      <div class="today-foot">
        <p class="today-last" id="todayLast"></p>
        <button type="button" class="btn-sub" id="removeBtn">한 잔 빼기</button>
      </div>
    </section>

    <!-- 주 / 월 기록 -->
    <section class="card stats" aria-label="주, 월 기록">
      <div class="stats-head">
        <p class="card-label">기록 모아보기</p>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" id="tabWeek" aria-selected="true">주</button>
          <button type="button" role="tab" class="tab" id="tabMonth" aria-selected="false">월</button>
        </div>
      </div>
      <div class="period">
        <button type="button" class="btn-arrow" id="prevBtn" aria-label="이전">‹</button>
        <p class="period-title" id="periodTitle"></p>
        <button type="button" class="btn-arrow" id="nextBtn" aria-label="다음">›</button>
      </div>
      <div id="chart"></div>
      <dl class="summary" id="summary"></dl>
    </section>
  </main>

  <footer class="bottom">
    <button type="button" class="btn-main" id="addBtn"><span class="plus" aria-hidden="true">+</span>한 잔 마셨어요</button>
  </footer>

  <!-- 설정: 하루 목표 · 한 잔의 양 · 기록 백업 -->
  <dialog id="settingsDialog" class="dialog sheet" aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <p class="dialog-title" id="settingsTitle">설정</p>
      <button type="button" class="btn-close" id="settingsClose" aria-label="닫기">✕</button>
    </div>

    <section class="set-group">
      <p class="set-label">하루 목표</p>
      <div class="stepper">
        <button type="button" class="btn-step" id="goalMinus" aria-label="목표 한 잔 줄이기">−</button>
        <p class="step-value"><span id="goalValue">8</span>잔</p>
        <button type="button" class="btn-step" id="goalPlus" aria-label="목표 한 잔 늘리기">+</button>
      </div>
    </section>

    <section class="set-group">
      <p class="set-label">한 잔의 양</p>
      <div class="chips" id="cupChips" role="radiogroup" aria-label="한 잔의 양"></div>
      <p class="set-total" id="goalTotal"></p>
    </section>

    <section class="set-group">
      <p class="set-label">기록 백업</p>
      <p class="set-help">휴대폰을 바꾸거나 앱을 다시 설치할 때를 대비해 기록을 파일로 저장해 두세요.</p>
      <div class="backup-buttons">
        <button type="button" class="btn-line" id="exportBtn">파일로 저장하기</button>
        <button type="button" class="btn-line" id="importBtn">파일에서 불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <p class="set-status" id="backupStatus" role="status"></p>
    </section>
  </dialog>

  <!-- 지우기 · 불러오기 전에 묻는 창 -->
  <dialog id="confirmDialog" class="dialog">
    <p class="dialog-title" id="confirmTitle">정말 지울까요?</p>
    <p class="dialog-text" id="confirmText"></p>
    <div class="dialog-buttons">
      <button type="button" class="btn-cancel" id="cancelBtn">취소</button>
      <button type="button" class="btn-danger" id="okBtn">지우기</button>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
